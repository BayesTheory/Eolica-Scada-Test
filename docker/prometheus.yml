global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: eolica-api
    metrics_path: /metrics
    static_configs:
      # Porta interna do container, não a publicada no host: o Prometheus fala
      # com a API pela rede do compose.
      - targets: ["api:8080"]
        labels:
          service: eolica-scada
