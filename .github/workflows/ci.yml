name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Lint e tipos — falham rápido e barato, antes de qualquer teste.
  # ───────────────────────────────────────────────────────────────────────────
  quality:
    name: lint + tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `setup-python` antes do uv não é redundante: sem ele, `uv pip install
      # --system` mira o Python do sistema do runner, que no Ubuntu é
      # externally-managed (PEP 668) e recusa instalação. Era a causa de todos
      # os jobs Python falharem em segundos, antes de rodar qualquer coisa.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv pip install --system -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (formatação)
        run: ruff format --check .

      - name: Mypy (estrito)
        run: mypy

  # ───────────────────────────────────────────────────────────────────────────
  # Arquitetura — as setas de dependência do DDD apontam para dentro?
  # Roda como job próprio para que a violação apareça nomeada no PR, em vez de
  # se perder no meio de 165 testes.
  # ───────────────────────────────────────────────────────────────────────────
  architecture:
    name: regras de arquitetura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv pip install --system -e ".[dev]"
      - name: Camadas e ausência de segredos
        run: pytest tests/architecture -v

  # ───────────────────────────────────────────────────────────────────────────
  # Testes — matriz de versões suportadas.
  # ───────────────────────────────────────────────────────────────────────────
  tests:
    name: testes (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `--system` e `--python` juntos são contraditórios e o uv aborta. Quem
      # escolhe a versão é o `setup-python` acima; aqui só se instala nela.
      - name: Instalar dependências
        run: uv pip install --system -e ".[dev]"

      - name: Suíte completa com cobertura
        run: |
          pytest \
            --cov=src/eolica \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml

      - name: Cobertura mínima do domínio
        # O domínio é onde mora a regra de negócio: 95% não é aspiração, é
        # piso. As camadas externas têm alvo menor por serem I/O.
        run: |
          coverage report \
            --include="src/eolica/domain/*" \
            --fail-under=95

      - name: Publicar resultados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python }}
          path: |
            junit.xml
            coverage.xml
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Frontend — tipos, testes e, principalmente, o contrato com a API.
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Tipos correspondem ao schema publicado
        # O passo que impede o skew entre backend e frontend: regenera os tipos
        # a partir do openapi.json versionado e falha se o resultado divergir do
        # que está commitado. Mudar um contrato sem regenerar quebra aqui, e não
        # na tela do operador.
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.ts \
            || { echo "::error::src/api/schema.ts está defasado. Rode 'npm run api:types'."; exit 1; }

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm run test

      - name: Build
        run: npx vite build

  # ───────────────────────────────────────────────────────────────────────────
  # O openapi.json versionado reflete o código?
  # ───────────────────────────────────────────────────────────────────────────
  contract:
    name: contrato da API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv pip install --system -e ".[dev]"
      - name: Schema publicado está atualizado
        run: |
          python scripts/export_openapi.py
          git diff --exit-code frontend/openapi.json \
            || { echo "::error::frontend/openapi.json está defasado. Rode 'python scripts/export_openapi.py'."; exit 1; }

  # ───────────────────────────────────────────────────────────────────────────
  # Segurança — dependências e código.
  # ───────────────────────────────────────────────────────────────────────────
  security:
    name: segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: o scan de segredo precisa comparar commits.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      # As dependências do projeto PRECISAM estar instaladas antes do audit.
      # Sem isto, o pip-audit varre apenas o ambiente do runner e as próprias
      # dependências dele — e reporta "0 vulnerabilidades" sem nunca ter olhado
      # pandas, fastapi, pydantic ou torch. Um scanner que audita a si mesmo é
      # pior que nenhum: passa a dar garantia falsa.
      - name: Instalar o projeto e as ferramentas
        run: |
          uv pip install --system -e ".[dev]"
          uv pip install --system pip-audit

      # Guarda contra o scanner voltar a auditar o ambiente errado sem que
      # ninguém perceba — um audit verde sobre o escopo errado é pior que
      # nenhum audit, porque dá garantia falsa.
      - name: Confirmar que o audit enxerga as dependências do projeto
        run: |
          pip-audit --format=json --progress-spinner=off --skip-editable > audit.json || true
          python -c "import json,sys; d=json.load(open('audit.json')); n={x['name'].lower() for x in d.get('dependencies',[])}; m={'pandas','fastapi','pydantic','numpy'}-n; sys.exit('audit fora de escopo, nao viu: '+', '.join(sorted(m))) if m else print('ok:',len(n),'pacotes auditados')"

      # Sem `--strict`, e com motivo: `--strict` falha em qualquer dependência
      # que o audit não consiga resolver — o que inclui `eolica-scada`, que é o
      # próprio projeto, instalado como editable e ausente do PyPI por
      # definição. Nenhuma combinação de flags faz `--strict` conviver com isso.
      #
      # A garantia que `--strict` deveria dar ("não passe verde sem ter olhado
      # de verdade") é entregue pelo passo acima, que verifica o escopo de forma
      # explícita em vez de inferir por ausência de erro.
      - name: Vulnerabilidades conhecidas nas dependências
        run: pip-audit --desc --skip-editable --progress-spinner=off

      - name: Varredura de segredos no histórico
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # Docker — a imagem builda e o container responde ao probe?
  # Buildar sem subir provaria metade do que interessa.
  # ───────────────────────────────────────────────────────────────────────────
  docker:
    name: imagem e smoke test
    runs-on: ubuntu-latest
    needs: [quality, tests, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          load: true
          tags: eolica-scada:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A imagem escuta em 8080 (default do Cloud Run) e respeita $PORT. O
      # mapeamento estava em 8000:8000 desde antes dessa mudança, então o host
      # publicava uma porta em que nada escutava — 22 tentativas de curl com
      # "connection reset" enquanto o container estava perfeitamente saudável.
      #
      # `$PORT` é passado explicitamente para que o valor apareça no comando, e
      # não só no default da imagem: quem lê este passo consegue ver por que a
      # porta da direita é 8080.
      - name: Subir o container
        run: |
          docker run -d --name eolica -p 8000:8080 \
            -e PORT=8080 \
            -e EOLICA_ENVIRONMENT=ci \
            -e EOLICA_HEALTH_WINDOW_SIZE=12 \
            eolica-scada:ci

      - name: Esperar ficar pronto
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready > /dev/null; then
              echo "pronto na tentativa $attempt"
              exit 0
            fi
            # Se o container já morreu, esperar mais 58 segundos não ajuda.
            if [ "$(docker inspect -f '{{.State.Running}}' eolica)" != "true" ]; then
              echo "::error::o container parou de rodar"
              break
            fi
            sleep 2
          done

          # Diagnóstico antes de desistir. Na primeira falha deste job, o
          # container estava saudável e escutando — o que faltava era o
          # mapeamento de portas, invisível sem isto aqui.
          echo "::group::mapeamento de portas"
          docker port eolica || echo "(nenhuma porta publicada)"
          echo "::endgroup::"
          echo "::group::estado do container"
          docker inspect -f 'Running={{.State.Running}} ExitCode={{.State.ExitCode}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}' eolica
          echo "::endgroup::"
          echo "::group::logs"
          docker logs eolica
          echo "::endgroup::"
          echo "::error::a aplicação não respondeu em http://localhost:8000/health/ready"
          exit 1

      - name: Smoke — o relatório diário responde
        run: |
          curl -fsS http://localhost:8000/api/v1/reports/2022-01-20 | tee /tmp/report.json
          python -c "import json,sys; d=json.load(open('/tmp/report.json')); assert d['health']['status'] in {'OK','ALERTA','EM_MANUTENCAO'}, d"

      - name: Smoke — data inexistente devolve 404, não 500
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/reports/2030-01-01)
          test "$status" = "404" || { echo "esperava 404, veio $status"; exit 1; }

      - name: Logs do container
        if: always()
        run: docker logs eolica
