[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eolica-scada"
version = "2.0.0"
description = "Plataforma de monitoramento preditivo de turbinas eólicas a partir de dados SCADA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rian" }]
keywords = ["scada", "wind-turbine", "mlops", "anomaly-detection", "ddd"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

# ─────────────────────────────────────────────────────────────────────────────
# Dependências do núcleo.
#
# Deliberadamente SEM torch/xgboost/mlflow: o domínio e os casos de uso não
# conhecem nenhum framework de ML. Isso mantém `pytest` na casa dos segundos e
# permite subir a API com adaptadores stub em ambientes sem GPU/modelo.
# ─────────────────────────────────────────────────────────────────────────────
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "pyyaml>=6.0,<7",
    "structlog>=24.1",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "prometheus-client>=0.20,<1",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
# Adaptadores reais de ML. `pip install -e '.[ml]'` para treinar/servir de verdade.
ml = [
    "torch>=2.3,<3",
    "xgboost>=2.0,<4",
    "scikit-learn>=1.5,<2",
    "mlflow>=2.14,<4",
]
# Co-piloto conversacional (opcional, desligado por padrão).
llm = ["google-generativeai>=0.7,<1"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    # httpx2, não httpx: o TestClient do Starlette passou a exigir o primeiro e
    # emite DeprecationWarning com o segundo — que, com filterwarnings=error,
    # quebra a coleta.
    "httpx2>=0.1",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
]

[project.scripts]
eolica = "eolica.interfaces.cli.main:app"

[project.urls]
Repository = "https://github.com/BayesTheory/Eolica-Scada-Test"
Dataset = "https://zenodo.org/records/15700928"

[tool.hatch.build.targets.wheel]
packages = ["src/eolica"]

# ─────────────────────────────────────────────────────────────────────────────
# Ruff
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Notebooks são análise exploratória: têm outro ciclo de vida e outro padrão.
# O que sai deles e vira produto passa a viver em src/ e aí sim é lintado.
extend-exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "TCH",       # type-checking imports
    "PTH",       # use pathlib
    "RUF",
    "ANN",       # anotações de tipo obrigatórias
    "S",         # bandit (segurança)
]
ignore = [
    "ANN401",  # permite Any explícito em pontos de fronteira
    "B008",    # Depends() no default é o idioma do FastAPI
    # Comentários e docstrings são em português: acentuação e travessão não são
    # "caractere unicode ambíguo", são a língua.
    "RUF001",
    "RUF002",
    "RUF003",
    # TC001-003 mandam mover imports usados só em anotação para dentro de
    # `if TYPE_CHECKING:`. Aqui isso é contraproducente: o teste de arquitetura
    # ignora imports sob TYPE_CHECKING (não são acoplamento de runtime), então
    # obedecer a regra permitiria a um módulo de `application` importar
    # `infrastructure` sem que a violação de camada fosse detectada. A regra de
    # arquitetura vale mais que a micro-otimização de import.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]          # assert é o ponto do pytest
"src/eolica/interfaces/cli/*" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["eolica"]

# ─────────────────────────────────────────────────────────────────────────────
# Mypy — estrito no domínio, tolerante na fronteira com libs sem stubs.
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["eolica"]

[[tool.mypy.overrides]]
module = ["torch.*", "xgboost.*", "mlflow.*", "sklearn.*", "scipy.*", "google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "eolica.infrastructure.*"
disallow_untyped_decorators = false

# ─────────────────────────────────────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# "." torna `tests.fakes` importável independentemente de o pytest ser
# invocado como `pytest` ou `python -m pytest` — só o segundo põe o CWD no
# sys.path, e depender disso quebraria no CI.
pythonpath = ["src", "."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "unit: testes de domínio/aplicação, sem I/O (devem rodar em ms)",
    "contract: valida contratos de dado e schemas de API",
    "integration: sobe a API com adaptadores fake",
    "ml: exige as dependências do extra [ml] (torch/xgboost/mlflow)",
    "slow: leva mais de um segundo",
]
filterwarnings = ["error", "ignore::DeprecationWarning:mlflow.*"]

[tool.coverage.run]
source = ["src/eolica"]
branch = true
omit = ["*/interfaces/cli/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]
